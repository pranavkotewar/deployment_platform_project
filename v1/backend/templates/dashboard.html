<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .page-header h1 {
    font-size: 26px;
    margin-bottom: 6px;
  }

  .page-header p {
    color: #94a3b8;
    font-size: 13px;
  }

  .container {
    width: 100%;
    max-width: 520px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 32px;
  }

  label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #e2e8f0;
    font-size: 14px;
    margin-bottom: 18px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #3b82f6;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: #2563eb;
  }

  button:disabled {
    background: #475569;
    cursor: not-allowed;
  }

  #status {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }

  .status-info {
    background: #1e3a5f;
    border: 1px solid #3b82f6;
    color: #93c5fd;
  }

  .status-success {
    background: #14301f;
    border: 1px solid #22c55e;
    color: #86efac;
  }

  .status-error {
    background: #3a1818;
    border: 1px solid #ef4444;
    color: #fca5a5;
  }

  #status a {
    color: #93c5fd;
    font-weight: 600;
  }

  #logsBox {
    display: none;
    margin-top: 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 12px 14px;
    max-height: 280px;
    overflow-y: auto;
  }

  #logsBox pre {
    font-family: 'Consolas', monospace;
    font-size: 12px;
    color: #94a3b8;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>Automated Deployment System</h1>
  <p>Paste a repo URL and click deploy</p>
</div>

<div class="container">
  <form id="deployForm">
    <label for="repo_url">GitHub Repo URL</label>
    <input type="text" id="repo_url" name="repo_url"
           placeholder="https://github.com/username/repo.git" required>

    <button type="submit" id="deployBtn">Deploy</button>
  </form>

  <div id="status"></div>
  <div id="logsBox"><pre id="logsText"></pre></div>
</div>

<script>
  const form = document.getElementById('deployForm');
  const btn = document.getElementById('deployBtn');
  const statusBox = document.getElementById('status');
  const logsBox = document.getElementById('logsBox');
  const logsText = document.getElementById('logsText');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const repoUrl = document.getElementById('repo_url').value;

    btn.disabled = true;
    btn.textContent = 'Deploying...';

    statusBox.style.display = 'block';
    statusBox.className = 'status-info';
    statusBox.textContent = 'Triggering Jenkins pipeline...';

    logsBox.style.display = 'none';
    logsText.textContent = '';

    try {
      const res = await fetch('/deploy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'repo_url=' + encodeURIComponent(repoUrl)
      });

      const data = await res.json();

      if (data.status === 'triggered') {
        statusBox.className = 'status-info';
        statusBox.textContent = 'Pipeline running, fetching logs...';
        logsBox.style.display = 'block';
        pollBuildStatus(data.queue_url, data.live_url);
      } else {
        statusBox.className = 'status-error';
        statusBox.textContent = 'Error: ' + data.message;
        resetButton();
      }
    } catch (err) {
      statusBox.className = 'status-error';
      statusBox.textContent = 'Could not reach backend: ' + err.message;
      resetButton();
    }
  });

  function pollBuildStatus(queueUrl, liveUrl) {
    const interval = setInterval(async function () {
      const res = await fetch('/build-status?queue_url=' + encodeURIComponent(queueUrl));
      const data = await res.json();

      if (data.status === 'queued') {
        logsText.textContent = 'Waiting in Jenkins queue...';
        return;
      }

      if (data.status === 'error') {
        clearInterval(interval);
        statusBox.className = 'status-error';
        statusBox.textContent = 'Error: ' + data.message;
        resetButton();
        return;
      }

      logsText.textContent = data.console;
      logsBox.scrollTop = logsBox.scrollHeight;

      if (!data.building) {
        clearInterval(interval);

        if (data.result === 'SUCCESS') {
          statusBox.className = 'status-success';
          statusBox.innerHTML = 'Deployment successful! Live link: <a href="' +
            liveUrl + '" target="_blank">' + liveUrl + '</a>';
        } else {
          statusBox.className = 'status-error';
          statusBox.textContent = 'Build finished with status: ' + data.result;
        }

        resetButton();
      }
    }, 2500);
  }

  function resetButton() {
    btn.disabled = false;
    btn.textContent = 'Deploy';
  }
</script>

</body>
</html>
